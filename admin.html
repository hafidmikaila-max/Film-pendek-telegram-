<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin CineBreve</title><link rel="stylesheet" href="style.css"><style>.box{background:#191922;border:1px solid #333;padding:18px;border-radius:16px;margin:18px 0}.field{display:block;margin:12px 0}.field span{display:block;color:#bbb;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;background:#101017;color:white;border:1px solid #444;border-radius:9px}.field textarea{min-height:75px}.listrow{border-top:1px solid #333;padding:12px 0;display:flex;justify-content:space-between;gap:12px}.secondary,.danger{padding:9px 12px;border:0;border-radius:8px;background:#444;color:white}.danger{background:#9d2533}.note{color:#f3b9c0}.ok{color:#9fe0b2}</style></head><body><main class="app"><header><a class="brand" href="./"><span class="logo">▶</span><span><b>CineBreve</b><small>Panel de administración</small></span></a><a href="./">Inicio</a></header><p id="notice" class="note">Conecta Supabase mediante config.js antes de usar el panel.</p><section id="loginbox" class="box"><h2>Acceso de administrador</h2><form id="login"><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="primary">Iniciar sesión</button></form><p id="loginmsg"></p></section><section id="manager" class="hidden"><div class="box"><button id="logout" class="secondary" style="float:right">Cerrar sesión</button><h2>Añadir / editar película</h2><form id="filmform"><input id="id" type="hidden"><label class="field"><span>Título de la película *</span><input id="title" required></label><label class="field"><span>Categoría *</span><input id="category" required placeholder="Romance, Drama, Acción..."></label><label class="field"><span>URL de la imagen del póster *</span><input id="poster" type="url" required placeholder="https://..."></label><label class="field"><span>URL del video o página de la película *</span><input id="video" type="url" required placeholder="URL MP4 o página de origen"></label><label class="field"><span>Deskripsi</span><textarea id="description"></textarea></label><button class="primary">Guardar película</button><button type="button" id="reset" class="secondary">Limpiar</button><p id="formmsg"></p></form></div><div class="box"><h2>Lista de películas</h2><div id="list">Cargando…</div></div></section><footer><a href="./">Volver al sitio</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
